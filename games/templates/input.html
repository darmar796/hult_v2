{% extends "/home/darmar796/hult_version2/accounts/templates/accounts/master_loggedin.html" %}

{% block title %}
  Input
{% endblock %}

{% block content %}
    <div class="div-3">
        <h1 class="text-white">Enter a name to join the game</h1>
        <form class="site-form" action="{% url 'games:input_view' game_id %}" method="post">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="Join">
        </form>
        <p><a href="/games/{{game_id}}/">Back</a></p>
    </div>

{% endblock %}
