{% extends "/home/darmar796/hult_version2/accounts/templates/accounts/master_loggedin.html" %}

{% block title %}
  Modify
{% endblock %}

{% block content %}
    <div class="div-3">
        <h1 class="text-white"> Enter a name to substitute player: {{player_name}} </h1>
        <form class="site-form" action="{% url 'games:change_player_name' game_id player_id %}" method="post">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="Substitute">
        </form>

        <p><a href="/games/{{game_id}}/{{player_id}}">Back</a></p>
    </div>
{% endblock %}
